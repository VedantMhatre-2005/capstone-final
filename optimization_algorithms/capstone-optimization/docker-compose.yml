version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000-8002:8000" # range allows up to 3 scaled replicas
    volumes:
      - results-data:/app/results # named volume
      - ./backend:/app # bind mount (dev hot-reload)
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000

    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  results-data:
