version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000-8002:8000" # range allows up to 3 scaled replicas
    volumes:
      - results-data:/app/results # named volume
      - ./backend:/app # bind mount (dev hot-reload)
      - "../../prediction-final/Traffic Forecasting/Dataset/Single Network/mumbai_stqgcn_dataset_10k.npz:/models/mumbai_stqgcn_dataset_10k.npz:ro"
      - "../../prediction-final/Traffic Forecasting/Single Network/Unidirectional/STQGCN/stqgcn_K5_model.pt:/models/stqgcn_K5_model.pt:ro"
    environment:
      STQGCN_DATASET_PATH: /models/mumbai_stqgcn_dataset_10k.npz
      STQGCN_CHECKPOINT_PATH: /models/stqgcn_K5_model.pt
    restart: always

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile

    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  results-data:
